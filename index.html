  <!-- Custom Animations & Styles (Template Match) -->
  <style>
    .font-geist { font-family: 'Geist', sans-serif !important; }
    .font-display { font-family: 'Google Sans Flex', sans-serif !important; }
    .font-montserrat { font-family: 'Montserrat', sans-serif !important; }
    .font-body { font-family: 'Inter', sans-serif !important; }


    /* Template glass panels */
    .glass-panel {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .glass-panel-dark {
      background: rgba(23, 23, 23, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Template grid lines */
    .grid-lines {
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
    }
    .dark .grid-lines {
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    }

    /* Template spotlight card */
    .spotlight-card {
      position: relative;
      overflow: hidden;
    }
    .spotlight-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(193, 255, 114, 0.15), transparent 40%);
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
      z-index: 10;
    }
    .spotlight-card:hover::before {
      opacity: 1;
    }

    /* Template animations */
    @keyframes fade-in-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slide-down { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }
    .animate-fade-in-up { animation: fade-in-up 0.8s ease-out forwards; }
    .animate-slide-down { animation: slide-down 0.7s ease-out forwards; }
    .animate-scale-in { animation: scale-in 0.5s ease-out forwards; }

    .animate-delay-100 { animation-delay: 0.1s; }
    .animate-delay-200 { animation-delay: 0.2s; }
    .animate-delay-300 { animation-delay: 0.3s; }
    .animate-delay-400 { animation-delay: 0.4s; }
    .animate-delay-500 { animation-delay: 0.5s; }
    .animate-delay-600 { animation-delay: 0.6s; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    html { scroll-behavior: smooth; }
    ::selection { background: #c1ff72; color: #171717; }

    /* Focus visible styles */
    *:focus-visible { outline: 2px solid #c1ff72; outline-offset: 2px; border-radius: 4px; }
    a:focus-visible, button:focus-visible { outline-width: 2px; }
    .focus-ring:focus-visible { outline: 2px solid #c1ff72; outline-offset: 2px; border-radius: 4px; }

    @media (max-width: 639px) {
      .mobile-compact-config .grid.grid-cols-1.sm\:grid-cols-3 {
        grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
        align-items: center;
        gap: 0.5rem;
      }
      .mobile-compact-config .sm\:col-span-2 {
        grid-column: span 1 / span 1;
      }
      .mobile-compact-config .grid.grid-cols-1.sm\:grid-cols-3 > label,
      .mobile-compact-config .grid.grid-cols-1.sm\:grid-cols-3 > span {
        font-size: 0.8125rem;
        line-height: 1.25rem;
      }
      .mobile-compact-config select,
      .mobile-compact-config input:not([type="radio"]):not([type="checkbox"]) {
        min-height: 44px;
        padding-top: 0.5rem !important;
        padding-bottom: 0.5rem !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

  <script>
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      document.addEventListener('mousemove', (e) => {
        document.querySelectorAll('.spotlight-card').forEach((card) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
          card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });
      });
    }
  </script>
